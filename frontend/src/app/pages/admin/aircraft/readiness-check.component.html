<div class="container">
  <div class="header-section">
    <h2>Aircraft Readiness Check</h2>
  </div>

  <ng-container *ngIf="vm$ | async as vm">
    <div class="form-card">
      <form [formGroup]="readinessForm" (ngSubmit)="checkReadiness()">
        <div class="form-group">
          <label>Select Flight</label>
          <select formControlName="flightId" class="form-control">
            <option value="">Choose a flight...</option>
            <option *ngFor="let flight of vm.flights" [value]="flight.id">
              {{ flight.flightNumber }} - {{ flight.source }} → {{ flight.destination }}
            </option>
          </select>
        </div>

        <div class="form-actions" style="display: flex; gap: 1rem; align-items: flex-end;">
          <button type="submit" class="btn-primary" [disabled]="readinessForm.invalid || vm.loading">
            {{ vm.loading ? 'Updating...' : 'Check Readiness' }}
          </button>
        </div>
      </form>
    </div>

    <!-- Quick Assign Aircraft (Always visible if a flight is selected) -->
    <div class="form-card" *ngIf="readinessForm.get('flightId')?.value"
      style="margin-top: 1rem; border-top: 2px solid #3a3dcb;">
      <h3>Quick Assign Aircraft</h3>
      <p style="color: #a0a0b0; font-size: 0.9rem; margin-bottom: 1rem;">Assign an aircraft to the selected flight
        directly.</p>

      <div class="form-group">
        <select [(ngModel)]="selectedAircraftId" class="form-control">
          <option [ngValue]="null">Select an Aircraft to Assign</option>
          <option *ngFor="let aircraft of vm.allAircraft" [value]="aircraft.id">
            {{ aircraft.name }} ({{ aircraft.model }}) - Status: {{ aircraft.status }}
          </option>
        </select>
      </div>
      <button class="btn-primary" [disabled]="!selectedAircraftId || assigning" (click)="assignAircraft()"
        style="margin-top: 1rem; width: auto;">
        {{ assigning ? 'Assigning...' : 'Assign Aircraft Now' }}
      </button>
    </div>

    <!-- Results Section -->
    <div class="result-card" *ngIf="vm.readinessResult" style="margin-top: 2rem;">
      <div [ngClass]="{ 'ready': vm.readinessResult.isReady, 'not-ready': !vm.readinessResult.isReady }">
        <h3>{{ vm.readinessResult.isReady ? '✅ Flight is Ready' : '❌ Flight is Not Ready' }}</h3>
        <p>{{ vm.readinessResult.message }}</p>

        <!-- Crew Selection if not ready -->
        <div class="crew-assignment-section"
          *ngIf="!vm.readinessResult.isReady && vm.readinessResult.message.includes('Crew')">
          <h4>Assign Available Crew Members</h4>
          <div class="crew-selection-list">
            <div *ngFor="let member of vm.availableCrew" class="crew-item">
              <label>
                <input type="checkbox" [checked]="selectedCrewIds.includes(member.id)"
                  (change)="toggleCrewSelection(member.id)">
                <span class="crew-info">{{ member.name }} ({{ member.role }})</span>
              </label>
            </div>
          </div>
          <button class="btn-primary" [disabled]="selectedCrewIds.length === 0 || assigning"
            (click)="assignSelectedCrew()">
            {{ assigning ? 'Assigning...' : 'Assign Selected Crew (' + selectedCrewIds.length + ')' }}
          </button>
        </div>
      </div>
    </div>

    <div class="error-alert" *ngIf="vm.error">{{ vm.error }}</div>
  </ng-container>
</div>
